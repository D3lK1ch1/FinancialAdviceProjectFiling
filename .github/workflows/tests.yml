name: tests

# Runs the no-documents tier: what a bare clone can run. samples/ and docs/ are
# gitignored (client documents never enter git), so the tests that read real PDFs
# skip here with a reason - `-rs` prints it in the log so a skip is never silent.
# Nothing here calls Ollama.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented floor (README, "Dependencies"); 3.12 is current.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -rs

  file-hygiene:
    name: file hygiene (no client documents)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block added PDF/Word/zip files
        run: |
          added=$(git diff --name-status --diff-filter=A \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            -- '*.pdf' '*.docx' '*.doc' '*.zip')
          if [ -n "$added" ]; then
            echo "::error::This PR adds a file type that never enters git (README.md, 'Client documents never enter git'):"
            echo "$added"
            exit 1
          fi
